[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcinside-shorts-candidates"
version = "0.1.0"
description = "DCInside post collector and Codex-powered Shorts candidate evaluator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "Jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
dc-shorts-candidates = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: invokes a live external service and is opt-in",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP036"]
